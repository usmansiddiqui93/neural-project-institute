<title>Neural Project Institute</title>

<style>
/* Layout: a planning board. Pages sit on a faint schedule grid; the hero is a live Gantt of the learning path, milestones are diamonds. */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --sunk: #e8edeb;
  --ink: #17242f;
  --muted: #5a6a72;
  --line: #d3dbd8;
  --accent: #1d6b52;
  --accent-ink: #ffffff;
  --accent-soft: #dcece5;
  --mile: #b97813;
  --mile-soft: #f6e8cf;
  --bad: #b3372b;
  --bad-soft: #f7e1de;
  --grid: rgba(23, 36, 47, .045);
  --cert-paper: #fbfaf6;
  --cert-ink: #1a2630;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --f-cert: "Instrument Serif", Georgia, "Times New Roman", serif;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1517; --surface: #172024; --sunk: #1d282c; --ink: #e4ebe8; --muted: #9aaab0; --line: #2b383d;
  --accent: #4fbf93; --accent-ink: #0b1a14; --accent-soft: #173a2e; --mile: #e3a84a; --mile-soft: #3a2c14;
  --bad: #ee7b6e; --bad-soft: #3d1d19; --grid: rgba(228, 235, 232, .035); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1517; --surface: #172024; --sunk: #1d282c; --ink: #e4ebe8; --muted: #9aaab0; --line: #2b383d;
  --accent: #4fbf93; --accent-ink: #0b1a14; --accent-soft: #173a2e; --mile: #e3a84a; --mile-soft: #3a2c14;
  --bad: #ee7b6e; --bad-soft: #3d1d19; --grid: rgba(228, 235, 232, .035); color-scheme: dark }

* { box-sizing: border-box }
html { scroll-behavior: smooth }
body {
  background: var(--bg); color: var(--ink); font: 400 16px/1.6 var(--f-body);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 48px 48px; min-height: 100vh;
}
a { color: var(--accent) }
h1, h2, h3, h4 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.12; letter-spacing: -.01em }
h1 { font-size: clamp(2.2rem, 5.5vw, 3.9rem); font-weight: 780; font-stretch: 88% }
h2 { font-size: clamp(1.6rem, 3.4vw, 2.3rem); font-weight: 740; font-stretch: 92% }
h3 { font-size: 1.2rem; font-weight: 680 }
p { margin: 0 }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 20px }
.eyebrow { font: 500 .75rem/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted) }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums }
.muted { color: var(--muted) }
.stack { display: flex; flex-direction: column; gap: 14px }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 600 .95rem/1 var(--f-body);
  padding: 13px 20px; border-radius: var(--r); border: 1.5px solid var(--ink); background: transparent; color: var(--ink);
  cursor: pointer; text-decoration: none; transition: transform .12s, background .12s }
.btn:hover { transform: translateY(-1px) }
.btn:focus-visible, a:focus-visible, button:focus-visible, input:focus-visible, label:focus-within { outline: 3px solid var(--mile); outline-offset: 2px }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.btn.ghost { border-color: var(--line) }
.btn.small { padding: 9px 14px; font-size: .85rem }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none }

/* Header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--line) }
header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 12px }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font: 760 1.05rem/1 var(--f-display); font-stretch: 85% }
.brand svg { flex: none }
.lockup { display: flex; flex-direction: column; gap: 3px }
.lockup small { font: 500 .66rem/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-stretch: normal }
@media (max-width: 560px) { .lockup small { display: none } }
.pillars { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 28px; margin-top: 28px }
.pillars > div { display: flex; flex-direction: column; gap: 10px; border-top: 2px solid var(--ink); padding-top: 16px }
.pillars p { color: var(--muted); font-size: .95rem }
.prose { max-width: 68ch; display: flex; flex-direction: column; gap: 14px }
.prose p { font-size: 1.05rem }
.guide-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 0 28px; margin-top: 24px }
.gitem { display: flex; flex-direction: column; gap: 8px; padding: 20px 0; border-top: 1px solid var(--line); text-decoration: none; color: var(--ink) }
.gitem h3 { font-size: 1.15rem } .gitem:hover h3 { color: var(--accent) }
.gitem p { color: var(--muted); font-size: .94rem }
.article { display: grid; grid-template-columns: 1fr; gap: 40px }
.article .body { display: flex; flex-direction: column; gap: 36px; min-width: 0; max-width: 72ch }
.article .body section + section { margin-top: 0 }
.article .body h2 { font-size: 1.45rem; margin-bottom: 12px }
.article .body p { font-size: 1.04rem; margin-bottom: 10px }
.article .body ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 8px }
.article .body table { white-space: normal } .article .body td, .article .body th { white-space: normal; vertical-align: top; min-width: 120px }
.chapter-list { list-style: none; padding: 0; margin: 24px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 0 28px; counter-reset: ch }
.chapter-list li { border-top: 1px solid var(--line) }
.chapter-list a { display: grid; grid-template-columns: 44px 1fr; gap: 4px 12px; padding: 16px 0; text-decoration: none; color: var(--ink) }
.chapter-list a:hover b { color: var(--accent) }
.chapter-list .n { grid-row: span 2; font: 500 .85rem var(--f-mono); color: var(--accent); padding-top: 3px }
.chapter-list b { font: 650 1.05rem/1.3 var(--f-display) }
.chapter-list small { color: var(--muted); font-size: .88rem }
.faq-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 32px; margin-top: 24px }
.faq-groups ul { list-style: none; padding: 0; margin: 10px 0 0; display: flex; flex-direction: column; gap: 9px }
.faq-groups a { color: var(--ink); text-decoration: none; font-size: .95rem } .faq-groups a:hover { color: var(--accent) }
.gloss { display: grid; grid-template-columns: minmax(160px, 260px) 1fr; gap: 0 24px; margin-top: 20px }
.gloss dt, .gloss dd { padding: 12px 0; border-top: 1px solid var(--line); margin: 0 }
.gloss dt { font-weight: 600 } .gloss dd { color: var(--muted) }
@media (max-width: 560px) { .gloss { grid-template-columns: 1fr } .gloss dd { border-top: 0; padding-top: 0 } }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px }
.tile b { font: 760 1.8rem/1 var(--f-display); font-variant-numeric: tabular-nums }
.tile small { color: var(--muted); font-size: .82rem }
.admin-table { background: var(--surface); border: 1px solid var(--line); border-radius: 10px }
.admin-table td { vertical-align: middle }
.consent { display: flex; gap: 12px; align-items: flex-start; font-size: .86rem; line-height: 1.5; color: var(--muted); background: var(--sunk); border-radius: var(--r); padding: 12px 14px; cursor: pointer }
.consent input { margin-top: 3px; flex: none; width: 18px; height: 18px; accent-color: var(--accent) }
.consent a { color: var(--accent) }
.btn.is-off { opacity: .45; pointer-events: none }
.legal { max-width: 72ch; display: flex; flex-direction: column; gap: 28px }
.legal section + section { margin-top: 0 }
.legal h2 { font-size: 1.3rem; margin-bottom: 8px }
.legal p, .legal li { font-size: 1rem }
.legal ol, .legal ul { padding-left: 1.2em; margin: 6px 0 0; display: flex; flex-direction: column; gap: 6px }
.legal .callout { background: var(--mile-soft); border-radius: 10px; padding: 18px 20px; line-height: 1.6 }
.legal p { margin-bottom: 10px }
.legal section.strong p:not(.plain) { font-weight: 600 }
.legal .plain { background: var(--accent-soft); border-radius: 8px; padding: 10px 14px; font-size: .95rem; display: flex; flex-direction: column; gap: 2px }
.legal .plain span { font: 500 .7rem/1.4 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent) }
.legal-toc ol { columns: 2 260px; column-gap: 56px; padding-left: 1.8em; display: block }
.legal-toc li { padding-left: 4px }
.legal-toc li { margin-bottom: 6px; break-inside: avoid } .legal-toc a { color: var(--ink); text-decoration: none } .legal-toc a:hover { color: var(--accent) }
.idtable { width: 100%; max-width: 640px; margin: 6px 0 12px; table-layout: fixed } .idtable th { width: 38% } .idtable td, .idtable th { white-space: normal; overflow-wrap: anywhere } .idtable th { text-transform: none; letter-spacing: 0; font: 500 .9rem var(--f-body); color: var(--muted); padding-right: 24px } .idtable td { white-space: normal }
mark.todo { background: var(--bad-soft); color: var(--bad); padding: 0 4px; border-radius: 3px }
.toc { display: flex; flex-direction: column; gap: 8px; font-size: .9rem; align-self: start; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px) }
.toc a { color: var(--muted); text-decoration: none } .toc a:hover { color: var(--accent) }
.cta-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 10px; margin-top: 16px }
@media (min-width: 900px) { .article { grid-template-columns: 1fr 260px } }
nav.main { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end }
nav.main a { color: var(--ink); text-decoration: none; font-weight: 500; font-size: .92rem; padding: 8px 10px; border-radius: var(--r) }
nav.main a:hover, nav.main a[aria-current="page"] { background: var(--sunk) }
.demo-bar { background: var(--mile-soft); color: var(--ink); font-size: .85rem; text-align: center; padding: 8px 16px; border-bottom: 1px solid var(--line) }

main { padding-block: 40px 80px; min-height: 60vh }
section + section { margin-top: 88px }

/* Hero */
.hero { display: grid; grid-template-columns: 1fr; gap: 36px }
.hero-copy { display: flex; flex-direction: column; gap: 22px; max-width: 46rem }
.hero-copy .lede { font-size: 1.15rem; color: var(--muted); max-width: 38rem }
.gantt { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; overflow-x: auto }
.gantt svg { display: block; width: 100%; min-width: 620px; height: auto }
.gantt-cap { display: flex; flex-wrap: wrap; gap: 18px; font: .78rem var(--f-mono); color: var(--muted); margin-top: 10px }
.gantt-cap i { display: inline-block; width: 18px; height: 8px; border-radius: 2px; vertical-align: middle; margin-right: 6px }
.facts { display: flex; flex-wrap: wrap; gap: 28px; padding-top: 6px }
.facts div { display: flex; flex-direction: column; gap: 2px }
.facts b { font: 760 1.6rem/1 var(--f-display); font-variant-numeric: tabular-nums }
.facts span { font-size: .85rem; color: var(--muted) }

/* Steps */
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 0; border-top: 2px solid var(--ink); margin-top: 28px }
.step { padding: 18px 18px 6px 0; display: flex; flex-direction: column; gap: 8px; position: relative }
.step .n { font: 500 .8rem var(--f-mono); color: var(--accent) }
.step p { color: var(--muted); font-size: .95rem }

/* Course cards */
.grid-courses { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; margin-top: 28px }
.ccard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 22px; display: flex; flex-direction: column; gap: 14px; min-width: 0 }
.ccard .meta { display: flex; justify-content: space-between; gap: 10px; align-items: baseline }
.ccard p { color: var(--muted); font-size: .95rem; flex: 1 }
.ccard .foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-top: 14px; border-top: 1px dashed var(--line) }
.price { font: 740 1.35rem/1 var(--f-display); font-variant-numeric: tabular-nums }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 500 .72rem/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase;
  padding: 6px 8px; border-radius: 4px; background: var(--sunk); color: var(--muted) }
.chip.ok { background: var(--accent-soft); color: var(--accent) }
.chip.mile { background: var(--mile-soft); color: var(--mile) }
.chip.bad { background: var(--bad-soft); color: var(--bad) }
.bar { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px }

.bundle { display: grid; grid-template-columns: 1fr; gap: 20px; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 32px; margin-top: 18px }
.bundle .muted { color: color-mix(in srgb, var(--bg) 70%, var(--ink)) }
.bundle .btn.primary { background: var(--mile); border-color: var(--mile); color: #1b1305 }
.bundle .price { font-size: 2.2rem }
.bundle s { opacity: .6; font-weight: 500; font-size: 1.1rem; margin-left: 8px }

/* Verify band */
.verify-band { display: grid; grid-template-columns: 1fr; gap: 20px; align-items: center; border: 1.5px solid var(--ink); border-radius: 12px; padding: 28px; background: var(--surface) }
form.inline { display: flex; gap: 10px; flex-wrap: wrap }
input[type=text], input[type=email] { font: 500 1rem var(--f-body); padding: 12px 14px; border: 1.5px solid var(--line); border-radius: var(--r);
  background: var(--bg); color: var(--ink); min-width: 0; flex: 1 1 220px }
input.code { font-family: var(--f-mono); text-transform: uppercase; letter-spacing: .04em }
label.field { display: flex; flex-direction: column; gap: 6px; font-size: .88rem; font-weight: 500 }
label.field input { flex: none; width: 100% }

/* FAQ */
details { border-top: 1px solid var(--line); padding-block: 16px }
details:last-child { border-bottom: 1px solid var(--line) }
summary { cursor: pointer; font-weight: 600; font-size: 1.02rem; list-style: none; display: flex; justify-content: space-between; gap: 12px }
summary::after { content: "+"; font-family: var(--f-mono); color: var(--muted) }
details[open] summary::after { content: "–" }
details p { color: var(--muted); margin-top: 10px; max-width: 65ch }

/* Course detail */
.detail { display: grid; grid-template-columns: 1fr; gap: 32px }
.detail .side { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 16px; align-self: start }
.outcomes { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px }
.outcomes li { display: flex; gap: 12px; align-items: flex-start }
.outcomes li::before { content: ""; flex: none; width: 10px; height: 10px; margin-top: 8px; background: var(--accent); transform: rotate(45deg) }
.chapters { display: flex; flex-direction: column; border-top: 2px solid var(--ink) }
.chap { display: grid; grid-template-columns: 52px 1fr auto; gap: 14px; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--line) }
.chap .num { font: 500 .85rem var(--f-mono); color: var(--muted) }
.chap h4 { font-size: 1.05rem; font-weight: 650 }
.chap small { color: var(--muted); font-size: .85rem }
.crumbs { font-size: .88rem; color: var(--muted); margin-bottom: 18px }
.crumbs a { color: var(--muted) }

/* Player */
.player { display: grid; grid-template-columns: 1fr; gap: 20px }
.slide { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: clamp(24px, 5vw, 52px); min-height: 380px;
  display: flex; flex-direction: column; gap: 18px; position: relative; overflow: hidden }
.slide .count { position: absolute; top: 18px; right: 22px; font: .8rem var(--f-mono); color: var(--muted) }
.slide h2 { font-size: clamp(1.7rem, 4vw, 2.6rem); max-width: 22ch }
.slide p.lead { font-size: 1.12rem; max-width: 60ch }
.slide ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; max-width: 62ch }
.slide li { padding-left: 22px; position: relative }
.slide li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 8px; height: 8px; border: 2px solid var(--accent); transform: rotate(45deg) }
.slide.enter { animation: slideIn .28s ease-out }
@keyframes slideIn { from { opacity: .3; transform: translateX(14px) } to { opacity: 1; transform: none } }
.dots { display: flex; gap: 6px; flex-wrap: wrap }
.dots button { width: 28px; height: 6px; border-radius: 3px; border: 0; background: var(--line); cursor: pointer; padding: 0 }
.dots button.on { background: var(--accent) }
.controls { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap }

/* Quiz */
.quiz { display: flex; flex-direction: column; gap: 22px }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 22px; display: flex; flex-direction: column; gap: 12px }
.q h4 { font: 600 1.05rem/1.4 var(--f-body) }
.opt { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: var(--r); cursor: pointer; background: var(--bg) }
.opt input { margin-top: 5px; accent-color: var(--accent) }
.opt.right { border-color: var(--accent); background: var(--accent-soft) }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft) }
.result { border-radius: 10px; padding: 22px; display: flex; flex-direction: column; gap: 12px }
.result.pass { background: var(--accent-soft) }
.result.fail { background: var(--bad-soft) }

/* Dashboard */
.dash-row { display: grid; grid-template-columns: 1fr; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px }
.table-wrap { overflow-x: auto }
table { width: 100%; border-collapse: collapse; font-size: .92rem }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap }
th { font: 500 .72rem var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }

/* Certificate */
.cert-shell { max-width: 900px; margin-inline: auto }
.cert { container-type: inline-size; background: var(--cert-paper); color: var(--cert-ink); border-radius: 4px; aspect-ratio: 1.414 / 1; max-width: 100%;
  position: relative; box-shadow: 0 1px 0 rgba(0,0,0,.05), 0 18px 50px -20px rgba(0,0,0,.35); overflow: hidden }
.cert .frame { position: absolute; inset: 2.6cqw; border: .25cqw solid #1a2630; }
.cert .frame::after { content: ""; position: absolute; inset: .9cqw; border: .1cqw solid #1d6b52 }
.cert .inner { position: absolute; inset: 6cqw 7cqw; display: flex; flex-direction: column; align-items: center; text-align: center }
.cert .c-brand { display: flex; align-items: center; gap: 1.2cqw; font: 760 1.9cqw/1 var(--f-display); font-stretch: 85%; letter-spacing: .02em; color: #1a2630 }
.cert .c-kicker { margin-top: 3.4cqw; font: 500 1.35cqw/1 var(--f-mono); letter-spacing: .35em; text-transform: uppercase; color: #1d6b52 }
.cert .c-title { margin-top: 1.4cqw; font: 400 5cqw/1 var(--f-cert); color: #1a2630 }
.cert .c-pre { margin-top: 3cqw; font: 400 1.5cqw/1.3 var(--f-body); color: #4b5961 }
.cert .c-name { margin-top: 1.2cqw; font: italic 400 6cqw/1.05 var(--f-cert); color: #1a2630; border-bottom: .12cqw solid #b97813; padding: 0 3cqw .8cqw; max-width: 90%; overflow-wrap: anywhere }
.cert .c-course { margin-top: 2.4cqw; font: 700 2.4cqw/1.2 var(--f-display); font-stretch: 90%; color: #1a2630 }
.cert .c-foot { margin-top: auto; width: 100%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 2cqw; font: 400 1.15cqw/1.4 var(--f-body); color: #4b5961 }
.cert .c-foot .l { text-align: left } .cert .c-foot .r { text-align: right }
.cert .c-foot b { display: block; font: 500 1.3cqw/1.3 var(--f-mono); color: #1a2630; letter-spacing: .04em }

    { id: "accept", h: "Accepting these Terms and how the contract is made", plain: "You agree to these Terms by ticking the boxes and paying. Read them first and save a copy.",
      body: [`These Terms apply to every use of the Services. By ticking the acceptance boxes and completing payment, you enter into a contract with us on these Terms. If you don't agree, don't buy or use the Services.`, `The contract is made in English through these steps: (1) you enter your name and email; (2) you read and accept these Terms and the Privacy Policy and tick the consent boxes; (3) you are taken to Stripe's secure checkout, where you can check and correct your details before paying; (4) the contract is concluded when payment is confirmed, and Stripe sends you a receipt by email.`, `We keep a record of your purchase and of the version of these Terms you accepted. The current version is always available on this page; you can print it or save it as a PDF from your browser.`] },
    { id: "elig", h: "Who can buy", plain: "You must be 18 or older and give us accurate details.",
      body: [`You must be at least 18 years old and legally able to enter into contracts. You must give a correct name and an email address you control. Your certificates will be issued in the name you give.`] },
    { id: "price", h: "Price and payment", plain: `PMAI costs ${P}, paid once. There are no subscriptions or hidden charges.`,
      body: [`PMAI costs ${P} (US dollars) as a single, one-time payment. Where the law requires VAT, GST or sales tax, it is calculated at checkout based on your location and shown before you pay. There is no subscription and no automatic renewal. Payments are processed by Stripe; we never see or store your card details. Your bank may charge currency conversion fees; these are outside our control.`] },
    { id: "what", h: "What you get and for how long", plain: "PMAI gives you all six courses and their certificates for at least 24 months.",
      body: [`PMAI gives one person access to all courses, chapter assessments, course certificates and the final PMAI certificate offered on the site at the time of purchase, plus any updates we make to them.`, `We guarantee access for at least 24 months from purchase. After that, access continues for as long as we offer the Services. If we ever close the Services, we will give at least 60 days' notice by email so you can complete any course and claim your certificates.`, `Free content (chapter 1 of each course, the guides and the glossary) can be changed or withdrawn at any time.`] },
    { id: "withdraw", h: "Your right of withdrawal (consumers)", plain: "EU and UK consumers can cancel within 14 days only until they start using the paid content. Once you access it, you can no longer cancel.",
      body: [`If you are a consumer in the European Union, the European Economic Area or the United Kingdom, you normally have 14 days to withdraw from an online purchase without giving a reason. PMAI is digital content supplied immediately after payment. Under Article 16(m) of EU Directive 2011/83/EU (in Italy, Article 59(1)(o) of the Consumer Code; in the UK, regulation 37 of the Consumer Contracts Regulations 2013), you lose the right of withdrawal once access to the content begins, provided you gave your express prior consent and acknowledged this. You do this by ticking the separate box at checkout.`, `If you have paid but not yet opened any paid chapter (chapter 2 or later of any course), you can still withdraw within 14 days of purchase. Email ${email} with the words "I withdraw from my contract for PMAI", your name, and the email you paid with. We will refund the full amount within 14 days using the same payment method, at no cost to you.`, `Withdrawal does not apply to business customers.`] },
    { id: "refund", h: "10-day refund guarantee", plain: "Not happy? Ask for a full refund within 10 days of purchase, as long as you haven't claimed a certificate.",
      body: [`In addition to any legal rights you have, we offer a voluntary 10-day refund guarantee. If you are not satisfied with PMAI for any reason, you can ask for a full refund within 10 calendar days of your purchase date, even if you have already started the courses.`, `The guarantee applies only if you have not yet claimed any certificate. Once a certificate has been issued in your name, the guarantee no longer applies, because the certificate is the result of the service you paid for.`, `To ask for a refund, email ${email} from the address you paid with, or include it in your message, within the 10 days. You don't need to give a reason. We will refund the full ${P} to your original payment method within 14 days of your request. Your bank may take a few more days to show it.`, `When a refund is made, your access to the paid content ends. The guarantee is limited to one refund per person and does not apply to purchases we reasonably believe are being made repeatedly to obtain the content for free.`] },
    { id: "conformity", h: "If something doesn't work", plain: "If the content is faulty, tell us and we will fix it or, if we can't, refund you as the law requires.",

    { id: "account", h: "Your access is personal", plain: "Don't share your access. It is linked to your email.",

    { id: "certs", h: "Assessments and certificates", plain: `Certificates are our own certificates of completion, valid for ${V} months. They are not an official licence or a PMI or Scrum credential.`,

    { id: "ip", h: "Intellectual property and trademarks", plain: "Our content belongs to us. You may use it only for your own learning.",

    { id: "changes", h: "Changes to the courses and the site", plain: "We may update the courses to keep them current, without reducing what you paid for.",

    { id: "indemnity", h: "Your responsibility for misuse", plain: "If you break these Terms and someone makes a claim against us because of it, you are responsible for that.",

    { id: "suspend", h: "Suspension and termination", plain: "We can suspend access if you seriously break these Terms. You can stop using the Services at any time.",

    { id: "force", h: "Events outside our control", plain: "We aren't responsible for delays caused by events we can't control.",

    { id: "update", h: "Changes to these Terms", plain: "We may update these Terms, but changes won't take away rights you already paid for.",

    { id: "law", h: "Governing law and courts", plain: "The law of the LLC's US state applies. Consumers keep the protection of their own country's laws and can go to their local courts.",

    { id: "transfer", h: "Transfers outside the EU", plain: "We are a US company, so data goes to the US. Transfers are protected by approved safeguards.",

/* Glossary */
const GLOSSARY = [
  ["Acceptance criteria", "Conditions a deliverable must meet to be accepted by the customer or Product Owner."],
  ["Actual cost (AC)", "The cost actually incurred for work performed up to a given date."],
  ["Agile", "An iterative approach that delivers work in small increments and adapts based on feedback."],
  ["Assumption", "Something believed to be true for planning purposes without proof."],
  ["Backlog", "An ordered list of work items waiting to be done."],
  ["Baseline", "The approved version of the scope, schedule or cost plan, used to measure performance."],
  ["Budget at completion (BAC)", "The total approved budget for the project."],
  ["Burndown chart", "A chart of remaining work against time."],
  ["Burnup chart", "A chart of completed work and total scope over time."],
  ["Business case", "Justification for a project, comparing expected benefits with costs and risks."],
  ["Change control", "The process for reviewing, approving and recording changes to the baseline."],
  ["Charter", "Document that authorises the project and names the sponsor and project manager."],
  ["Constraint", "A limit on the project, such as a fixed date, budget or resource."],
  ["Contingency reserve", "Budget or time set aside for identified risks."],
  ["Cost performance index (CPI)", "EV ÷ AC. Below 1.0 means the project is over budget for the work done."],
  ["Crashing", "Shortening the schedule by adding resources to critical activities."],
  ["Critical path", "The longest chain of dependent activities, which sets the shortest possible project duration."],
  ["Cycle time", "Time taken for one work item to go from start to done."],
  ["Definition of Done", "A shared standard that work must meet to be considered complete in Scrum."],
  ["Deliverable", "Any unique, verifiable product, result or capability produced by the project."],
  ["Dependency", "A relationship where one task relies on another to start or finish."],
  ["Earned value (EV)", "The budgeted value of the work actually completed."],
  ["Estimate at completion (EAC)", "Forecast of the total project cost, often BAC ÷ CPI."],
  ["Fast-tracking", "Shortening the schedule by doing activities in parallel that were planned in sequence."],
  ["Float (slack)", "How long an activity can be delayed without delaying the project."],
  ["Gantt chart", "A bar chart of tasks against a timeline."],
  ["Increment", "A usable piece of product completed in an iteration."],
  ["Issue", "A problem that is currently affecting the project."],
  ["Kanban", "A method of visualising work and limiting work in progress to improve flow."],
  ["Kickoff meeting", "The meeting that formally starts project execution with the team and stakeholders."],
  ["Lessons learned", "Knowledge gained during a project, recorded for future use."],
  ["Management reserve", "Budget held for unknown risks, controlled by management."],
  ["Milestone", "A significant point or event with zero duration."],
  ["Monte Carlo analysis", "Simulation that runs a schedule or budget many times to show likely outcomes."],
  ["PERT", "Program Evaluation and Review Technique; uses three-point estimates to forecast durations."],
  ["Planned value (PV)", "The budgeted value of work scheduled to be done by a given date."],
  ["Portfolio", "A collection of projects and programmes managed to meet strategic goals."],
  ["Product Owner", "The Scrum accountability for maximising product value and ordering the Product Backlog."],
  ["Programme", "A group of related projects managed together for combined benefits."],
  ["Project manager", "The person accountable for leading the team to deliver the project objectives."],
  ["RACI matrix", "A chart showing who is Responsible, Accountable, Consulted and Informed for each task."],
  ["RAG status", "Red, amber, green rating of project health."],
  ["Residual risk", "Risk remaining after a response has been carried out."],
  ["Resource levelling", "Adjusting the schedule to resolve resource overloads."],
  ["Retrospective", "A meeting where the team reviews how it worked and plans improvements."],
  ["Risk", "An uncertain event that would affect a project objective if it occurred."],
  ["Risk register", "A log of identified risks, their scores, owners and responses."],
  ["Schedule performance index (SPI)", "EV ÷ PV. Below 1.0 means the project is behind schedule."],
  ["Scope", "The work required to deliver the project's product, and only that work."],
  ["Scope creep", "Uncontrolled growth of scope without matching changes to time or budget."],
  ["Scrum", "An Agile framework using Sprints, three accountabilities, five events and three artifacts."],
  ["Scrum Master", "The Scrum accountability for the team's effectiveness and use of Scrum."],
  ["Sponsor", "The person or group that provides resources and support for the project and is accountable for enabling success."],
  ["Sprint", "A fixed-length iteration of one month or less in Scrum."],
  ["Stakeholder", "Anyone who affects or is affected by the project."],
  ["Story points", "A relative measure of the effort or complexity of a backlog item."],
  ["Triple constraint", "The link between scope, time and cost."],
  ["Velocity", "The amount of work a Scrum team completes per Sprint."],
  ["Work breakdown structure (WBS)", "A hierarchical decomposition of the project scope into deliverables and work packages."],
  ["Work in progress (WIP) limit", "A cap on how many items may be in a workflow stage at once."],
  ["Work package", "The lowest level of the WBS, which can be estimated, owned and tracked."]
];

/* ---------- Gantt hero ---------- */
function ganttSVG() {
  const W = 760, rowH = 46, top = 34, left = 210, weeks = 10, cw = (W - left - 20) / weeks;
  const plan = [["pmf", 0, 2], ["ssc", 2, 3], ["agl", 2, 2.5], ["rqm", 5, 2], ["lsc", 7, 2], ["ai", 4.5, 2]];
  const crit = ["pmf", "ssc", "rqm", "lsc"];
  let s = `<svg viewBox="0 0 ${W} ${top + rowH * 7 + 10}" role="img" aria-label="Learning path: six certifications scheduled across ten weeks, ending at the certified milestone">`;
  for (let w = 0; w <= weeks; w++) {
    const x = left + w * cw;
    s += `<line x1="${x}" y1="${top - 8}" x2="${x}" y2="${top + rowH * 7}" stroke="var(--line)" stroke-width="1"/>`;
    if (w < weeks) s += `<text x="${x + cw / 2}" y="${top - 14}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="var(--muted)">W${w + 1}</text>`;
  }
  plan.forEach(([id, st, len], i) => {
    const c = byId(id), y = top + i * rowH + 12, isC = crit.includes(id);
    s += `<text x="0" y="${y + 15}" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="500" fill="var(--ink)">${esc(c.name)}</text>`;
    s += `<rect x="${left + st * cw + 2}" y="${y}" width="${len * cw - 4}" height="20" rx="3" fill="${isC ? "var(--accent)" : "var(--sunk)"}" stroke="${isC ? "none" : "var(--muted)"}" stroke-dasharray="${isC ? "" : "4 3"}"/>`;
    s += `<text x="${left + st * cw + 10}" y="${y + 14}" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="${isC ? "var(--accent-ink)" : "var(--muted)"}">${c.code} · ${c.chapters.length} ch</text>`;
  });
  const my = top + 6 * rowH + 22, mx = left + 9.4 * cw;
  s += `<text x="0" y="${my + 5}" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="700" fill="var(--ink)">PMAI Certified</text>`;
  s += `<path d="M${mx} ${my - 11} l11 11 -11 11 -11 -11z" fill="var(--mile)"/>`;
  s += `<line x1="${left + 9 * cw}" y1="${top + 4 * rowH + 32}" x2="${mx}" y2="${my - 11}" stroke="var(--mile)" stroke-width="1.5" stroke-dasharray="3 3"/>`;
  return s + `</svg>`;
}

  </div>`;
}
let quizState = null;
function viewQuiz(c, i) {
  const ch = c.chapters[i], qs = quizState;
  const qhtml = ch.quiz.map((q, k) => `<fieldset class="q" style="margin:0"><legend class="sr" hidden>Question ${k + 1}</legend><h4>${k + 1}. ${esc(q.q)}</h4>
    ${q.a.map((a, j) => { const cls = qs?.done ? (j === q.c ? "right" : qs.ans[k] === j ? "wrong" : "") : "";
      return `<label class="opt ${cls}"><input type="radio" name="q${k}" value="${j}" ${qs?.ans[k] === j ? "checked" : ""} ${qs?.done ? "disabled" : ""}><span>${esc(a)}</span></label>` }).join("")}</fieldset>`).join("");
  let res = "";
  if (qs?.done) {
    const ok = qs.score >= CONFIG.passMark, next = i + 1 < c.chapters.length;
    res = `<div class="result ${ok ? "pass" : "fail"}"><h3>${ok ? "Chapter passed" : "Not passed yet"} · ${qs.score}/${ch.quiz.length}</h3>
      <p>${ok ? (next ? "Move on to the next chapter." : "That was the final chapter.") : `You need ${CONFIG.passMark} correct. Review the slides and try again.`}</p>
      <div class="row">${ok ? (next ? (canOpen(c, i + 1) ? `<a class="btn primary" href="#learn-${c.id}-${i + 1}">Next chapter</a>` : `<button class="btn primary" data-buy="all">Get PMAI to continue</button>`) : complete(c) ? `<a class="btn primary" href="#cert-${c.id}">Claim your certificate</a>` : `<a class="btn primary" href="#course-${c.id}">Back to course</a>`)
        : `<button class="btn primary" data-retake>Retake quiz</button><button class="btn ghost" data-review>Review slides</button>`}</div></div>`;
  }
  return `<form class="quiz" id="quizForm">${qhtml}${qs?.done ? res : `<button class="btn primary" type="submit" style="align-self:flex-start">Submit answers</button>`}</form>`;
}

async function runVerify(code) {
  const out = $("#vres"); if (!out) return;
  out.innerHTML = `<p class="muted">Checking…</p>`;
  try {
    const c = await verifyCode(code);
    if (!c) { out.innerHTML = `<div class="result fail"><h3>No certificate found</h3><p>No certificate matches <span class="mono">${esc(code.toUpperCase())}</span>. Check the ID for typos. The letters O and I are never used.</p></div>`; return }
    const st = certState(c), valid = st === "valid";
    const head = { valid: "Valid certificate", expired: `Expired on ${fmtDate(expiryOf(c))}`, revoked: "This certificate has been revoked" }[st];
    out.innerHTML = `<div class="result ${valid ? "pass" : "fail"}"><div class="row" style="justify-content:space-between"><h3>${head}</h3>${c.sample ? `<span class="chip mile">Sample</span>` : ""}</div>
      <div class="table-wrap"><table><tbody>

    ${P.filter(hit).map(p => `<tr><td>${shortDate(p.created_at)}</td><td>${esc(p.customer_name || "—")}</td><td class="mono">${esc(p.email)}</td><td class="mono">${fmtMoney(p.amount_total || 0, p.currency)}</td>
      <td>${p.terms_accepted ? chip("Yes", "ok") : chip("Not recorded", "")}</td><td>${p.refunded_at ? chip("Refunded " + shortDate(p.refunded_at), "bad") : chip("Paid", "ok")}</td>
      <td class="mono" style="font-size:.78rem">${esc(p.stripe_session_id || "")}</td>
      <td><button class="btn small ghost" data-refund="${esc(p.stripe_session_id)}" data-to="${p.refunded_at ? "0" : "1"}">${p.refunded_at ? "Undo refund" : "Mark refunded"}</button></td></tr>`).join("") || `<tr><td colspan="8" class="muted">No payments yet.</td></tr>`}</tbody></table>`;
  if (adminTab === "certificates") table = `<table><thead><tr><th>Certificate ID</th><th>Holder</th><th>Email</th><th>Certification</th><th>Score</th><th>Issued</th><th>Valid until</th><th>Status</th><th>Terms</th><th></th></tr></thead><tbody>
    ${C.filter(hit).map(c => { const st = certState(c); return `<tr><td class="mono"><a href="#verify-${esc(c.code)}">${esc(c.code)}</a></td><td>${esc(c.full_name)}</td><td class="mono">${esc(c.email)}</td><td>${esc(c.course_title)}</td><td class="mono">${c.score}%</td>
      <td>${shortDate(c.issued_at)}</td><td>${shortDate(expiryOf(c))}</td><td>${chip(st, st === "valid" ? "ok" : "bad")}</td><td class="mono">${esc(c.terms_version || "—")}</td>
      <td><button class="btn small ghost" data-certstatus="${esc(c.code)}" data-to="${c.status === "revoked" ? "valid" : "revoked"}">${c.status === "revoked" ? "Restore" : "Revoke"}</button></td></tr>` }).join("") || `<tr><td colspan="10" class="muted">No certificates issued yet.</td></tr>`}</tbody></table>`;
  return `<div class="row" style="justify-content:space-between;margin-bottom:22px"><div class="stack" style="gap:6px"><span class="eyebrow">Neural Project Institute · Admin</span><h1>Dashboard</h1>
      <span class="muted" style="font-size:.85rem">Updated ${new Date(adminData.generated_at).toLocaleString("en-GB")}</span></div>
    <div class="row"><button class="btn small" data-adminreload>Refresh</button><button class="btn small ghost" data-adminlock>Lock</button></div></div>
  ${adminData.demo ? `<div class="result fail" style="margin-bottom:18px"><b>Example data.</b> The preview can't reach your database, so it shows made-up students. On neuralprojectinstitute.com/#admin you'll see real data.</div>` : ""}
  <div class="tiles">${tile("Revenue", fmtMoney(revenue, "usd"), `${live.length} paid`)}${tile("Students", S.filter(s => s.status === "Active").length, `${S.filter(s => s.refundEligible).length} in refund window`)}${tile("Refunds", refunded.length, refunded.length ? fmtMoney(refunded.reduce((s, p) => s + (p.amount_total || 0), 0), "usd") : "")}${tile("Valid certificates", cstate("valid"), `${cstate("expired")} expired · ${cstate("revoked")} revoked`)}${tile("PMAI awarded", C.filter(c => c.course_id === "pmai" && certState(c) === "valid").length, "")}</div>
  <div class="row" style="justify-content:space-between;margin:28px 0 12px">
    <div class="row" role="tablist">${[["students", "Students"], ["payments", "Payments"], ["certificates", "Certificates"]].map(([k, l]) => `<button class="btn small ${adminTab === k ? "primary" : "ghost"}" data-admintab="${k}" role="tab" aria-selected="${adminTab === k}">${l}</button>`).join("")}</div>
    <div class="row"><input id="adminSearch" type="text" placeholder="Search name, email or ID" value="${esc(adminQ)}" style="min-width:220px"><button class="btn small" data-admincsv>Export CSV</button></div></div>
  <div class="table-wrap admin-table">${table}</div>
  <p class="muted" style="font-size:.85rem;margin-top:14px">Refunds: issue the money in Stripe first, then press "Mark refunded" here. That locks the student's paid chapters. Chapter-by-chapter progress is stored on each student's own device, so it doesn't appear here.</p>`;
}
const viewNotFound = () => `<h2>Page not found</h2><p style="margin-top:12px"><a href="#home">Go to the homepage</a></p>`;

/* ---------- Router ---------- */
let lastRoute = "";
function render() {
  const h = (location.hash || "#home").slice(1);
  const [page, ...rest] = h.split("-");
  if (h !== lastRoute) { if (page === "learn") { player = { slide: 0, mode: "slides" }; quizState = null } window.scrollTo(0, 0); lastRoute = h }
  document.querySelectorAll('nav.main a').forEach(a => a.getAttribute("href") === "#" + page ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  let html;
  if (page === "home" || page === "paid") html = viewHome();
  else if (page === "courses") html = viewCatalog();
  else if (page === "about") html = viewAbout();
  else if (page === "guides") html = viewGuides();
  else if (page === "guide") html = viewGuide(rest.join("-"));
  else if (page === "glossary") html = viewGlossary();
  else if (page === "admin") html = viewAdmin();
  else if (page === "terms") html = viewLegal("terms");
  else if (page === "privacy") html = viewLegal("privacy");
  else if (page === "legal") html = viewLegal("notice");
  else if (page === "course") html = viewCourse(rest[0]);
  else if (page === "learn") html = viewLearn(rest[0], +rest[1]);
  else if (page === "cert") html = viewCert(rest[0]);
  else if (page === "verify") html = viewVerify(rest.join("-"));
  else if (page === "dashboard") html = viewDashboard();
  else html = viewNotFound();
  app.innerHTML = html;
  if (page === "verify" && rest.length) runVerify(rest.join("-"));
  if (page === "cert" && mem.certs[rest[0]]) drawQR(mem.certs[rest[0]].code);
  if (page === "home" && location.hash === "#catalog") $("#catalog")?.scrollIntoView();
}

/* ---------- Events ---------- */
document.addEventListener("click", async e => {
  const t = e.target.closest("button, a"); if (!t) return;
  if (t.dataset.buy) { e.preventDefault(); return buy(t.dataset.buy) }
  if (t.dataset.admintab) { adminTab = t.dataset.admintab; return render() }
  if (t.hasAttribute("data-adminreload")) { adminData = null; return render() }
  if (t.hasAttribute("data-adminlock")) { adminKey.set(""); adminData = null; return render() }
  if (t.hasAttribute("data-admincsv")) {
    const S = adminStudents(), P = adminData.purchases, C = adminData.certificates, day = new Date().toISOString().slice(0, 10);
    if (adminTab === "students") csvDownload(`students-${day}.csv`, [["Name", "Email", "First purchase", "Status", "Refund window", "Valid certificates", "PMAI"], ...S.map(s => [s.name, s.email, s.first, s.status, s.refundEligible ? "Eligible" : "", s.validCerts, s.pmai ? "Yes" : ""])]);
    if (adminTab === "payments") csvDownload(`payments-${day}.csv`, [["Date", "Name", "Email", "Amount", "Currency", "Terms accepted", "Refunded at", "Stripe session"], ...P.map(p => [p.created_at, p.customer_name, p.email, (p.amount_total || 0) / 100, p.currency, p.terms_accepted ? "Yes" : "No", p.refunded_at || "", p.stripe_session_id])]);
    if (adminTab === "certificates") csvDownload(`certificates-${day}.csv`, [["Certificate ID", "Holder", "Email", "Certification", "Score", "Issued", "Valid until", "Status", "Terms version"], ...C.map(c => [c.code, c.full_name, c.email, c.course_title, c.score, c.issued_at, expiryOf(c).toISOString(), certState(c), c.terms_version || ""])]);
    return;
  }
  if (t.dataset.refund || t.dataset.certstatus) {
    if (!LIVE) return toast("Example data can't be changed.");
    t.disabled = true;
    try {
      if (t.dataset.refund) { await rpc("admin_set_refunded", { p_key: adminKey.get(), p_session: t.dataset.refund, p_refunded: t.dataset.to === "1" }); toast(t.dataset.to === "1" ? "Marked as refunded. Access removed." : "Refund undone. Access restored.") }
      else { await rpc("admin_set_certificate_status", { p_key: adminKey.get(), p_code: t.dataset.certstatus, p_status: t.dataset.to }); toast(t.dataset.to === "revoked" ? "Certificate revoked." : "Certificate restored.") }
      adminData = null; render();
    } catch (err) { toast(err.message); t.disabled = false }
    return;
  }
  if (t.dataset.jump) { e.preventDefault(); return document.getElementById(t.dataset.jump)?.scrollIntoView({ behavior: "smooth" }) }
  if (t.hasAttribute("data-next")) { player.slide++; return render() }
  if (t.hasAttribute("data-prev")) { player.slide--; return render() }
  if (t.dataset.goslide) { player.slide = +t.dataset.goslide; return render() }
  if (t.hasAttribute("data-quiz")) { player.mode = "quiz"; quizState = null; render(); return window.scrollTo(0, 0) }
  if (t.hasAttribute("data-retake")) { quizState = null; render(); return window.scrollTo(0, 0) }
  if (t.hasAttribute("data-review")) { player = { slide: 0, mode: "slides" }; quizState = null; return render() }
  if (t.dataset.renew) { const rid = t.dataset.renew; if (rid === "pmai") { mem.progress = {}; mem.certs = {}; save(); toast("Assessments reset. Pass all courses again to renew PMAI."); location.hash = "courses"; return } mem.progress[rid] = {}; mem.certs[rid] && (mem.certs[rid].renewing = true); delete mem.certs[rid]; save(); toast("Assessments reset. Pass every chapter again to receive a renewed certificate."); location.hash = "course-" + rid; return }
  if (t.hasAttribute("data-learner")) return askLearner("Used to link your purchases and certificates.", render);
  if (t.hasAttribute("data-print")) return window.print();
  if (t.dataset.fill) { $("#vcode").value = t.dataset.fill; return runVerify(t.dataset.fill) }
  if (t.dataset.copy) { try { await navigator.clipboard.writeText(t.dataset.copy); toast("Verification link copied.") } catch { toast(t.dataset.copy) } }
});
document.addEventListener("submit", async e => {
  const f = e.target; e.preventDefault();
  if (f.id === "adminLogin") { adminKey.set($("#adminKeyIn").value.trim()); adminData = null; return render() }
  if (f.id === "homeVerify") { const v = $("#hv").value.trim() || SAMPLE.code; location.hash = "verify-" + v.toUpperCase() }
  if (f.id === "verifyForm") { const v = $("#vcode").value.trim().toUpperCase(); history.replaceState(null, "", "#verify-" + v); lastRoute = "verify-" + v; runVerify(v) }
  if (f.id === "quizForm") {
    const [, id, i] = location.hash.slice(1).split("-"); const ch = byId(id).chapters[+i];
    const ans = ch.quiz.map((_, k) => { const x = f.querySelector(`input[name=q${k}]:checked`); return x ? +x.value : null });
    if (ans.includes(null)) return toast("Answer every question first.");
    const score = ans.filter((a, k) => a === ch.quiz[k].c).length;
    quizState = { ans, score, done: true };
    const pr = mem.progress[id] || (mem.progress[id] = {}); pr[i] = Math.max(pr[i] ?? 0, score); save();
    if (!mem.learner && score >= CONFIG.passMark && owns(id)) toast("Passed. Add your details under My learning to keep a record.");
    render(); $(".result")?.scrollIntoView({ block: "center" });
  }
  if (f.id === "claimForm" && !($("#claimConsent").checked && $("#claimPublish").checked)) return toast("Tick both boxes to continue.");
  if (f.id === "claimForm") {
    const id = location.hash.slice(1).split("-")[1], c = byId(id);
    mem.learner = { name: $("#claimName").value.trim(), email: $("#claimEmail").value.trim().toLowerCase() }; save();
    const btn = f.querySelector("button"); btn.disabled = true; btn.textContent = "Issuing…";
    try { await issueCert(c, scorePct(c)); toast("Certificate issued."); render() }
    catch (err) { $("#claimErr").textContent = err.message.includes("purchase") ? "We couldn't find a purchase for this email. Use the email you paid with." : err.message; btn.disabled = false; btn.textContent = "Issue my certificate" }
  }
});
document.addEventListener("keydown", e => {
  if (!location.hash.startsWith("#learn") || player.mode !== "slides" || e.target.matches("input")) return;
  const [, id, i] = location.hash.slice(1).split("-"); const n = byId(id)?.chapters[+i]?.slides.length; if (!n) return;
  if (e.key === "ArrowRight" && player.slide < n - 1) { player.slide++; render() }
  if (e.key === "ArrowLeft" && player.slide > 0) { player.slide--; render() }
});
document.addEventListener("input", e => {
  if (e.target.id === "adminSearch") { adminQ = e.target.value; const pos = e.target.selectionStart; render(); const el = $("#adminSearch"); if (el) { el.focus(); el.setSelectionRange(pos, pos) } return }
  if (e.target.id !== "glossQ") return;
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll("#glossList dt").forEach(dt => { const show = !q || dt.dataset.k.includes(q); dt.hidden = !show; dt.nextElementSibling.hidden = !show });
});
window.addEventListener("hashchange", render);

/* ---------- Boot ---------- */
document.title = CONFIG.brand;
$("#brandName").textContent = CONFIG.brand;
$("#footBrand").textContent = "© " + new Date().getFullYear() + " " + CONFIG.brand + (CONFIG.legalName ? " · Operated by " + CONFIG.legalName + (CONFIG.stateOfFormation ? ", a " + CONFIG.stateOfFormation + " LLC" : "") : "") + (CONFIG.address ? " · " + CONFIG.address : "");
$("#brandTag").textContent = CONFIG.tagline;
if (!LIVE) { const b = $("#demoBar"); b.hidden = false; b.textContent = "Preview mode: payments and the certificate database aren't connected yet, so purchases unlock for testing only." }
render();
refreshOwned().then(() => { if (location.hash === "#paid") toast(owns("all") || mem.owned.length ? "Payment received. Your course is unlocked." : "Payment is still processing. Refresh in a minute."); render() });
</script>
